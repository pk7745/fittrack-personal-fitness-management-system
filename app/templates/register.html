{% extends "base.html" %}

{% block title %}Create Account | FitTrack{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 540px;">
    <div class="auth-header">
      <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🏋️‍♂️</div>
      <h2>Start Your Fitness Journey</h2>
      <p>Create your FitTrack profile and begin tracking progress</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name *</label>
        <input type="text" id="name" class="form-input" placeholder="John Doe" required minlength="2" maxlength="100">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" class="form-input" placeholder="john@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password * (minimum 6 characters)</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="age">Age</label>
          <input type="number" id="age" class="form-input" placeholder="25" min="10" max="120">
        </div>
        <div class="form-group">
          <label class="form-label" for="gender">Gender</label>
          <select id="gender" class="form-select">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-binary">Non-binary</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="height">Height (cm)</label>
          <input type="number" id="height" class="form-input" placeholder="175" step="0.5" min="50" max="300">
          <div class="form-hint">Used for BMI calculation</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="weight">Weight (kg)</label>
          <input type="number" id="weight" class="form-input" placeholder="70" step="0.1" min="20" max="500">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="fitness_goal">Primary Fitness Goal</label>
        <select id="fitness_goal" class="form-select">
          <option value="General Fitness">General Fitness</option>
          <option value="Weight Loss">Weight Loss</option>
          <option value="Muscle Building">Muscle Building</option>
          <option value="Weight Gain">Weight Gain</option>
          <option value="Endurance">Endurance</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? 
      <a href="{{ url_for('auth.login_view') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
